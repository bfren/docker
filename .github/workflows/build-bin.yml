name: build-bin

# Reusable workflow: build and push a bfren-bin image (binaries used to build the bfren images, e.g. BusyBox).
#
#   Builds the Dockerfile in the repository root for linux/amd64 and linux/arm64 on native runners, and linux/arm/v7
#   using QEMU. Each build is pushed by digest, then one job joins the platforms into a
#   single multi-platform image with the tags. Quay.io only - nothing is published to Docker Hub.
#
#   Every build gets two build arguments: VERSION (the VERSION file) and NATIVE ('false' when built using QEMU).
#
#   Tags can use ${VERSION}. A tag that uses it is a release tag: images pin them, so the workflow refuses to run if
#   one already exists - bump VERSION instead. Tags without it (e.g. 'alpine') move with each build.
#
#   Runs on main build release tags. Runs on any other branch are development builds: -dev is added to every tag, and
#   they may be overwritten.
#
#   Call it from a job with a matrix to build several versions - each call must have different tags.

on:
  workflow_call:
    inputs:
      image:
        description: Image name, published as quay.io/bfren-bin/<image>
        required: true
        type: string
      build-args:
        description: Build arguments, one per line
        required: false
        type: string
        default: ''
      tags:
        description: Tags, one per line, using ${VERSION}
        required: true
        type: string
    secrets:
      QUAY_TOKEN:
        required: true

permissions:
  contents: read

env:
  IMAGE: quay.io/bfren-bin/${{ inputs.image }}
  # github is the calling workflow's context, so this is the branch it was run on
  SUFFIX: ${{ github.ref_name != 'main' && '-dev' || '' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tags: ${{ steps.read.outputs.tags }}
      key: ${{ steps.read.outputs.key }}
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7
      -
        name: Read version and tags
        id: read
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          # turn a list with one item per line into a JSON array, ignoring blank lines
          list() { jq -Rnc '[inputs | gsub("\\s"; "") | select(. != "")]' ; }
          VERSION=$(< VERSION)
          export VERSION
          release=$(grep -F '${VERSION}' <<< "${TAGS}" | envsubst | sed "s/\$/${SUFFIX}/" || true)
          tags=$(envsubst <<< "${TAGS}" | grep . | sed "s/\$/${SUFFIX}/")
          echo "${tags}"
          {
            echo "version=${VERSION}"
            echo "tags=$(list <<< "${tags}")"
            echo "release=$(list <<< "${release}")"
            # names this call's digest artifacts - a matrix of calls shares one run, so they must not clash
            echo "key=$(head -n 1 <<< "${tags}")"
          } >> "${GITHUB_OUTPUT}"
        shell: bash
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Check release tags are new
        # checked before building so a forgotten VERSION bump fails in seconds - development tags may be overwritten
        if: env.SUFFIX == ''
        env:
          RELEASE: ${{ steps.read.outputs.release }}
        run: |
          for tag in $(jq -r '.[]' <<< "${RELEASE}") ; do
            # only a real 'not found' means the tag is new - any other error (e.g. a timeout) stops the run
            if out=$(docker buildx imagetools inspect "${IMAGE}:${tag}" 2>&1) ; then
              echo "${IMAGE}:${tag} already exists - bump VERSION" ; exit 1
            elif ! grep -q ': not found$' <<< "${out}" ; then
              echo "${out}" ; exit 1
            fi
          done
        shell: bash

  execute:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [ linux/amd64, linux/arm64, linux/arm/v7 ]
    # amd64 and arm64 have native runners - arm/v7 builds on amd64 using QEMU
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      NATIVE: ${{ matrix.platform == 'linux/amd64' || matrix.platform == 'linux/arm64' }}
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        if: env.NATIVE != 'true'
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Build and push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            ${{ inputs.build-args }}
            NATIVE=${{ env.NATIVE }}
            VERSION=${{ needs.prepare.outputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      -
        name: Save digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ needs.prepare.outputs.key }}-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # runs only if every platform built, so an image is never published with platforms missing
    needs: [prepare, execute]
    runs-on: ubuntu-latest
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ needs.prepare.outputs.key }}-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Create multi-platform image
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          # join the platform digests into one image with every tag
          cd "${RUNNER_TEMP}/digests"
          docker buildx imagetools create $(jq -r --arg image "${IMAGE}" '.[] | "-t \($image):\(.)"' <<< "${TAGS}") \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:$(jq -r '.[0]' <<< "${TAGS}")"
        shell: bash
