# Copy to <image>/.github/workflows/build.yml - see README.md in this folder.
# It replaces dev.yml and publish.yml: branch pushes build '-dev' images, and published releases build release images.

name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@main
    with:
      # published as bfren/<image> and quay.io/bfren/<image>
      image: IMAGE

      # one folder per line, each containing a Dockerfile - leave out for a single Dockerfile in the root
      folders: |
        FOLDER

      # one platform per line - amd64 and arm64 build natively, anything else (e.g. linux/arm/v7) is slower
      platforms: |
        linux/amd64
        linux/arm64

      # optional: a script to run after the tests, given the test image's tag - e.g. to start the image under S6
      # smoke-test: ./smoke.sh

      # always this line - release builds publish, everything else is a -dev build
      publish: ${{ github.event_name == 'release' }}

      # tags for each folder, one per line - use ${FOLDER}, ${VERSION}, ${VERSION_MAJOR}, ${VERSION_MINOR}, and the
      # name of any version file (e.g. ${ALPINE_REVISION}) - do not add -dev, it is added for development builds
      tags: |
        ${FOLDER}
        ${FOLDER}-${VERSION_MAJOR}
        ${FOLDER}-${VERSION_MINOR}
        ${FOLDER}-${VERSION}

      # optional: one folder that also gets default-tags - leave out for images with several versions, so users choose
      # default-folder: FOLDER
      # default-tags: |
      #   latest
      #   ${VERSION_MAJOR}
      #   ${VERSION_MINOR}
      #   ${VERSION}

    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
